<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>قوائم التشغيل - فيديو بلس</title>
  <meta name="theme-color" content="#ff0000">
  <link rel="manifest" href="../manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .playlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 20px; }
    .playlist-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .2s; border: 1px solid var(--border-color); }
    .playlist-card:hover { transform: translateY(-4px); }
    .playlist-cover { position: relative; aspect-ratio: 16/9; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 3rem; overflow: hidden; }
    .playlist-cover img { width: 100%; height: 100%; object-fit: cover; }
    .playlist-count { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.75); color: #fff; font-size: .75rem; padding: 3px 10px; border-radius: 12px; }
    .playlist-body { padding: 14px; }
    .playlist-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; color: var(--text-primary); }
    .playlist-meta { font-size: .8rem; color: var(--text-secondary); }
    .create-box { background: var(--bg-card); border: 1px dashed var(--border-color); border-radius: 12px; padding: 20px; margin: 20px; }
    .create-box h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: var(--text-primary); }
    .create-box input, .create-box textarea { width: 100%; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; color: var(--text-primary); font-size: .9rem; }
    .btn-create { background: #ff0000; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: .9rem; font-weight: 700; cursor: pointer; }
    .btn-create:hover { background: #cc0000; }
    .btn-create:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" aria-label="القائمة">☰</button>
      <a href="../index.html" class="header-logo">فيديو<span>بلس</span></a>
    </div>

    <div class="header-search">
      <form class="search-form" action="search.html" method="get">
        <input type="text" name="q" class="search-input" placeholder="ابحث عن فيديو...">
        <button type="submit" class="search-btn">🔍</button>
      </form>
    </div>

    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" title="تبديل السمة">🌙</button>
      <button class="header-icon" title="بحث" onclick="document.querySelector('.search-input').focus()">🔍</button>
    </div>
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="app-sidebar" id="appSidebar">
    <a href="../index.html" class="sidebar-link">
      <span class="icon">🏠</span>
      <span>الرئيسية</span>
    </a>
    <div class="sidebar-divider"></div>
    <div class="sidebar-title">التصنيفات</div>
    <nav class="sidebar-categories">
      <div style="padding:12px 24px;color:#aaa;font-size:0.85rem;">جاري التحميل...</div>
    </nav>
    <div class="sidebar-divider"></div>
    <a href="../index.html" class="sidebar-link">
      <span class="icon">📺</span>
      <span>اشتراكاتي</span>
    </a>
    <a href="playlists.html" class="sidebar-link active">
      <span class="icon">📚</span>
      <span>المكتبة</span>
    </a>
  </aside>

  <!-- Main Content -->
  <main class="app-main">
    <div class="create-box">
      <h2>➕ إنشاء قائمة تشغيل جديدة</h2>
      <input type="text" id="playlistName" placeholder="اسم القائمة *" maxlength="255">
      <textarea id="playlistDesc" rows="2" placeholder="وصف القائمة (اختياري)"></textarea>
      <button class="btn-create" id="btnCreatePlaylist" onclick="handleCreatePlaylist()">إنشاء القائمة</button>
    </div>

    <div class="section-header" style="padding:0 20px;">
      <h2>قوائم التشغيل</h2>
    </div>
    <div class="playlist-grid" id="playlistsGrid">
      <div style="color:var(--text-secondary);padding:16px;">جاري التحميل...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>© 2026 فيديو بلس. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/player.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
