<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>قائمة التشغيل - فيديو بلس</title>
  <meta name="theme-color" content="#ff0000">
  <link rel="manifest" href="../manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .playlist-header { background: var(--bg-card); border-radius: 12px; padding: 24px; margin: 20px; border: 1px solid var(--border-color); }
    .playlist-header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary); }
    .playlist-header p { color: var(--text-secondary); font-size: .9rem; margin-bottom: 12px; }
    .playlist-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-play-all { background: #ff0000; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-danger-outline { background: transparent; color: #ff4444; border: 1px solid #ff4444; border-radius: 8px; padding: 10px 20px; cursor: pointer; }
    .playlist-item { display: flex; gap: 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin: 0 20px 12px; align-items: center; }
    .playlist-item img { width: 160px; height: 90px; object-fit: cover; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
    .playlist-item-info { flex: 1; min-width: 0; }
    .playlist-item-title { font-weight: 700; cursor: pointer; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-item-meta { font-size: .78rem; color: var(--text-secondary); margin-top: 4px; }
    .btn-remove { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: .8rem; flex-shrink: 0; }
    .btn-remove:hover { color: #ff4444; border-color: #ff4444; }
    @media (max-width: 600px) {
      .playlist-item img { width: 120px; height: 68px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" aria-label="القائمة">☰</button>
      <a href="../index.html" class="header-logo">فيديو<span>بلس</span></a>
    </div>

    <div class="header-search">
      <form class="search-form" action="search.html" method="get">
        <input type="text" name="q" class="search-input" placeholder="ابحث عن فيديو...">
        <button type="submit" class="search-btn">🔍</button>
      </form>
    </div>

    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" title="تبديل السمة">🌙</button>
      <button class="header-icon" title="بحث" onclick="document.querySelector('.search-input').focus()">🔍</button>
    </div>
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="app-sidebar" id="appSidebar">
    <a href="../index.html" class="sidebar-link">
      <span class="icon">🏠</span>
      <span>الرئيسية</span>
    </a>
    <div class="sidebar-divider"></div>
    <div class="sidebar-title">التصنيفات</div>
    <nav class="sidebar-categories">
      <div style="padding:12px 24px;color:#aaa;font-size:0.85rem;">جاري التحميل...</div>
    </nav>
    <div class="sidebar-divider"></div>
    <a href="../index.html" class="sidebar-link">
      <span class="icon">📺</span>
      <span>اشتراكاتي</span>
    </a>
    <a href="playlists.html" class="sidebar-link active">
      <span class="icon">📚</span>
      <span>المكتبة</span>
    </a>
  </aside>

  <!-- Main Content -->
  <main class="app-main">
    <div class="playlist-header" id="playlistHeader">
      <h1>جاري التحميل...</h1>
    </div>
    <div id="playlistVideos"></div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>© 2026 فيديو بلس. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/player.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
